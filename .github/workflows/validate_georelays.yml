name: Validate GeoRelay Data

# The weekly automation validates a relay snapshot before pushing its branch,
# but that check lives inside the scheduled job: a relay-directory change that
# arrives as a pull request is otherwise reviewed on faith. This runs the same
# validator against the reviewed baseline and publishes the resulting hash, so
# a proposed snapshot can be matched against the one the automation published.
on:
  pull_request:
    paths:
      - "relays/online_relays_gps.csv"
      - "scripts/validate_georelays.py"
      - "scripts/tests/**"
      - ".github/workflows/validate_georelays.yml"

# This job runs PR-authored code. Read-only, no secrets, and never
# pull_request_target.
permissions:
  contents: read

# A superseded run has nothing left to report; the sibling PR workflows do not
# set this, so drop it if the repo prefers them uniform.
concurrency:
  group: validate-georelays-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-relay-directory:
    name: Validate relay directory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout pull request
        # @v5 matches the sibling read-only PR workflows. fetch_georelays.yml
        # pins a SHA for a reason that does not apply here — it protects the
        # code that receives that job's write-capable token; this job has none.
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Test GeoRelay validator
        # Exercises the pull request's own validator and workflow tests. The
        # gate below deliberately does not use that copy.
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Validate relay directory against the reviewed baseline
        run: |
          set -euo pipefail

          # actions/checkout gives a pull_request run the merge ref, not the
          # base branch, so the reviewed copy has to be fetched explicitly.
          git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          git show "origin/${GITHUB_BASE_REF}:relays/online_relays_gps.csv" > "$RUNNER_TEMP/baseline.csv"

          # Gate with the reviewed validator rather than the pull request's copy,
          # or a change that edits data and validator together certifies itself:
          # dropping 86% of the directory passes if the same commit relaxes
          # MIN_BASELINE_FRACTION. The scheduled job validates from a main
          # checkout for the same reason. Stdlib-only, so a copy runs standalone.
          git show "origin/${GITHUB_BASE_REF}:scripts/validate_georelays.py" > "$RUNNER_TEMP/reviewed-validator.py"

          # --output is required and receives a verbatim copy of --input. It
          # stays in RUNNER_TEMP so validation can never write to the tracked
          # file it is checking.
          python3 "$RUNNER_TEMP/reviewed-validator.py" \
            --input relays/online_relays_gps.csv \
            --baseline "$RUNNER_TEMP/baseline.csv" \
            --output "$RUNNER_TEMP/validated-copy.csv" \
            --github-output "$RUNNER_TEMP/summary.txt"

          # Publish the hash so a reviewer can match a proposed snapshot against
          # the one the automation published, instead of taking it on faith.
          {
            echo "### GeoRelay validation"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/summary.txt"
          } >> "$GITHUB_STEP_SUMMARY"
