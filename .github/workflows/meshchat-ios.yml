name: MeshChat iOS build
on:
  push:
    branches: [ios-app]
    paths: ['MeshChatiOS/**', '.github/workflows/meshchat-ios.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: MeshChatiOS
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - run: xcodebuild -project MeshChat.xcodeproj -scheme MeshChat -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Screenshots
        run: |
          set -x
          xcodebuild -project MeshChat.xcodeproj -scheme MeshChat -destination 'platform=iOS Simulator,name=iPhone 16 Pro' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build | tail -3
          UDID=$(xcrun simctl list devices available | grep "iPhone 16 Pro (" | head -1 | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot $UDID; xcrun simctl bootstatus $UDID -b
          xcrun simctl status_bar $UDID override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 0 || true
          xcrun simctl install $UDID dd/Build/Products/Debug-iphonesimulator/MeshChat.app
          mkdir -p shots
          shot() { xcrun simctl terminate $UDID dev.meshchat.app || true; xcrun simctl launch $UDID dev.meshchat.app "${@:2}"; sleep 5; xcrun simctl io $UDID screenshot shots/$1.png; }
          shot 1-onboarding -onboarded NO
          shot 2-nearby -onboarded YES -tab 0
          shot 3-chats -onboarded YES -tab 1
          shot 4-thread -onboarded YES -tab 1 -openThread YES
          shot 5-you -onboarded YES -tab 2
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: MeshChatiOS/shots
