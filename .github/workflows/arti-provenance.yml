name: Tor Binary Provenance

# The Arti and IPtProxy xcframeworks are vendored binaries. These checks turn the policy in
# docs/ARTI-BINARY-PROVENANCE.md into an enforced gate:
#  1. The checked-in binaries and IPtProxy license must match the hash manifest.
#  2. A PR that changes a binary must also change at least one provenance
#     input (Rust source, lockfile, build script, or the doc itself).

on:
  push:
    branches:
      - main
    paths:
      - "localPackages/Arti/**"
      - "docs/ARTI-BINARY-PROVENANCE.md"
  pull_request:
    paths:
      - "localPackages/Arti/**"
      - "docs/ARTI-BINARY-PROVENANCE.md"

jobs:
  verify-hashes:
    name: Verify Tor artifact hashes against provenance doc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compare artifact hashes with manifest
        run: |
          set -euo pipefail
          doc="docs/ARTI-BINARY-PROVENANCE.md"

          # Extract the manifest: lines of "<sha256>  <path>" from the doc.
          grep -E '^[0-9a-f]{64}  localPackages/Arti/(Frameworks/(arti|IPtProxy)\.xcframework/|IPTPROXY-LICENSE\.txt)' "$doc" \
            | sort -k2 > expected.txt

          if [ ! -s expected.txt ]; then
            echo "::error::No hash manifest found in $doc"
            exit 1
          fi

          # Hash the same file set the doc documents.
          {
            find localPackages/Arti/Frameworks/arti.xcframework -maxdepth 3 -type f \
              -exec sha256sum {} +
            find localPackages/Arti/Frameworks/IPtProxy.xcframework -maxdepth 6 -type f \
              -exec sha256sum {} +
            sha256sum localPackages/Arti/IPTPROXY-LICENSE.txt
          } | sort -k2 > actual.txt

          if ! diff -u expected.txt actual.txt; then
            echo "::error::Checked-in Tor artifacts do not match the manifest in $doc. If the change is intentional, rebuild per the doc and update the manifest in the same PR."
            exit 1
          fi
          echo "All $(wc -l < actual.txt) artifact hashes match the provenance manifest."

  require-provenance-evidence:
    name: Binary changes must ship with provenance inputs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check changed files
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "Changed files:"
          echo "$changed"

          if ! echo "$changed" | grep -Eq '^localPackages/Arti/Frameworks/(arti|IPtProxy)\.xcframework/'; then
            echo "No binary artifact changes; nothing to verify."
            exit 0
          fi

          if echo "$changed" | grep -Eq '^(localPackages/Arti/(Cargo\.(toml|lock)|build(-arti|-iptproxy)?-ios(-device)?\.sh|IPTPROXY-LICENSE\.txt|arti-bitchat/)|docs/ARTI-BINARY-PROVENANCE\.md)'; then
            echo "Binary change is accompanied by provenance inputs."
            exit 0
          fi

          echo "::error::A Tor xcframework changed without matching source, lockfile, build-script, license, or provenance-doc changes. See docs/ARTI-BINARY-PROVENANCE.md."
          exit 1
