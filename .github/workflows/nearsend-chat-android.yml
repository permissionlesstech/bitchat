name: Nearsend Chat Android build
on:
  push:
    branches: [ios-app]
    paths: ['NearsendChatAndroid/**', '.github/workflows/nearsend-chat-android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NearsendChatAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Fetch Anton font (OFL)
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL -o app/src/main/res/font/anton_regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf
          test $(stat -c%s app/src/main/res/font/anton_regular.ttf) -gt 10000
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Unit tests (crypto vectors + relay simulation)
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest > test.log 2>&1
          code=$?
          grep -E "FAILED|AssertionError|error:|^e: |What went wrong" -A3 test.log | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do [ -f "$f" ] && echo "::notice::$(grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*"' "$f" | head -1)"; done
          exit $code
      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug > build.log 2>&1
          code=$?
          grep -E "^e: |error:|What went wrong|Execution failed|Could not|Unresolved|not found" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          exit $code
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          working-directory: NearsendChatAndroid
          script: |
            bash ci/shots.sh
            bash ci/service_wrap.sh
      - name: Commit font, wrapper and previews
        working-directory: .
        run: |
          mkdir -p NearsendChatAndroid/previews && cp NearsendChatAndroid/shots/*.png NearsendChatAndroid/previews/
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -f NearsendChatAndroid/app/src/main/res/font NearsendChatAndroid/gradlew NearsendChatAndroid/gradlew.bat NearsendChatAndroid/gradle NearsendChatAndroid/previews
          git diff --cached --quiet || (git commit -m "CI: Android font, wrapper and previews [skip ci]" && git pull --rebase --autostash origin ios-app && git push || (sleep 5; git pull --rebase --autostash origin ios-app && git push))
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: NearsendChatAndroid/app/build/outputs/apk/debug/app-debug.apk
