name: NearsendChat
options:
  bundleIdPrefix: app.nearsend
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NearsendChat:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Nearsend Chat
        UILaunchScreen:
          UIColorName: LaunchBackground
        CFBundleLocalizations: [en, sv, es, fr, de, pt, it, ar, tr, ru, zh-Hans, ja]
        UIAppFonts: [Anton-Regular.ttf]
        NSBluetoothAlwaysUsageDescription: Nearsend Chat uses Bluetooth to find and message people near you without internet.
        NSLocalNetworkUsageDescription: Nearsend Chat uses the local network to reach nearby devices.
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nearsend.chat
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
