name: MeshChat
options:
  bundleIdPrefix: dev.meshchat
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MeshChat:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MeshChat
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSBluetoothAlwaysUsageDescription: MeshChat uses Bluetooth to find and message people near you without internet.
        NSLocalNetworkUsageDescription: MeshChat uses the local network to reach nearby devices.
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.meshchat.app
        GENERATE_INFOPLIST_FILE: NO
